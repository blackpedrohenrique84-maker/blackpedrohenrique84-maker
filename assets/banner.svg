<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 516" width="100%" role="img" aria-label="Pedro Henrique, dev de software e modelador 3D">
<defs>
  <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity="0.28"/></pattern>
  <linearGradient id="name" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#eafff3"/><stop offset="0.55" stop-color="#00E676"/><stop offset="1" stop-color="#009c4f"/>
  </linearGradient>
  <filter id="glow" x="-5%" y="-5%" width="110%" height="110%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
    <stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.55"/>
  </radialGradient>
</defs>
<style>
  text { font-family: ui-monospace,'SF Mono',Consolas,'DejaVu Sans Mono','Courier New',monospace; white-space: pre; }
  .cur { animation: bl 1.1s steps(1) infinite; }
  @keyframes bl { 50% { opacity: 0; } }
</style>

