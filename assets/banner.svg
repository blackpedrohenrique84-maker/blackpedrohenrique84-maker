<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" role="img" aria-label="Pedro Henrique, dev de software e modelador 3D">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#b9ffd9"/>
      <stop offset="0.5" stop-color="#00E676"/>
      <stop offset="1" stop-color="#003d1f"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#00E676" fill-opacity="0.18"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00E676" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00E676" stop-opacity="0"/>
    </radialGradient>
    <path id="spark" d="M0-11Q0 0 11 0Q0 0 0 11Q0 0-11 0Q0 0 0-11Z"/>
  </defs>

  <style>
    .mono { font-family: ui-monospace, Consolas, 'Courier New', monospace; }
    .tw { animation: tw 3.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes tw { 0%,100% { transform: scale(.3); opacity: .2; } 50% { transform: scale(1); opacity: 1; } }
  </style>

  <rect width="1000" height="300" rx="14" fill="#060908"/>
  <rect width="1000" height="300" rx="14" fill="url(#dots)"/>
  <circle cx="782" cy="170" r="210" fill="url(#glow)"/>

  <!-- nome -->
  <rect x="60" y="34" width="104" height="24" rx="12" fill="none" stroke="#00E676" stroke-opacity="0.6"/>
  <text class="mono" x="112" y="51" font-size="13" fill="#00E676" text-anchor="middle">v0idguyy</text>

  <g font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="78" letter-spacing="-2" fill="url(#chrome)">
    <text x="56" y="130">pedro</text>
    <text x="56" y="205">henrique</text>
  </g>

  <text class="mono" x="62" y="245" font-size="16" fill="#9fb8a9">dev de software &#183; modelador 3d</text>
  <text class="mono" x="62" y="270" font-size="13" fill="#5c7366">rob&#243;tica &#183; hardware &#183; programa&#231;&#227;o</text>

  <!-- cubo + circuito -->
  <g transform="translate(0,20)">
    <!-- trilhas -->
    <g fill="none" stroke="#00E676" stroke-opacity="0.35" stroke-width="1.5" stroke-linejoin="round">
      <path d="M830 80H890L910 60H965"/>
      <path d="M830 150H880L900 170H965"/>
      <path d="M805 175V215L825 235H965"/>
      <path d="M760 80V45H690"/>
    </g>
    <g fill="none" stroke="#c8ffe0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path pathLength="100" stroke-dasharray="8 92" d="M830 80H890L910 60H965">
        <animate attributeName="stroke-dashoffset" values="100;-8" dur="3.2s" repeatCount="indefinite"/>
      </path>
      <path pathLength="100" stroke-dasharray="8 92" d="M830 150H880L900 170H965">
        <animate attributeName="stroke-dashoffset" values="100;-8" dur="4s" begin="0.8s" repeatCount="indefinite"/>
      </path>
      <path pathLength="100" stroke-dasharray="8 92" d="M805 175V215L825 235H965">
        <animate attributeName="stroke-dashoffset" values="100;-8" dur="3.6s" begin="1.5s" repeatCount="indefinite"/>
      </path>
      <path pathLength="100" stroke-dasharray="8 92" d="M760 80V45H690">
        <animate attributeName="stroke-dashoffset" values="100;-8" dur="2.8s" begin="0.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <g fill="#060908" stroke="#00E676" stroke-width="1.5">
      <circle cx="965" cy="60" r="4"/>
      <circle cx="965" cy="170" r="4"/>
      <circle cx="965" cy="235" r="4"/>
      <circle cx="690" cy="45" r="4"/>
    </g>

    <!-- cubo wireframe -->
    <g fill="none" stroke="#00E676" stroke-width="2" stroke-linejoin="round">
      <path d="M760 80V150H735" stroke-dasharray="4 5" stroke-opacity="0.5"/>
      <path d="M760 150H830" stroke-dasharray="4 5" stroke-opacity="0.5"/>
      <path d="M760 80H830V150"/>
      <path d="M735 105L760 80M805 105L830 80M805 175L830 150"/>
      <path d="M735 175L760 150" stroke-dasharray="4 5" stroke-opacity="0.5"/>
      <rect x="735" y="105" width="70" height="70" fill="#00E676" fill-opacity="0.09"/>
    </g>

    <!-- anel orbital -->
    <g transform="translate(782 128) rotate(-20)">
      <ellipse rx="125" ry="32" fill="none" stroke="#00E676" stroke-opacity="0.45"/>
      <circle r="5" fill="#e8fff3">
        <animateMotion dur="7s" repeatCount="indefinite" path="M-125,0 a125,32 0 1,0 250,0 a125,32 0 1,0 -250,0"/>
      </circle>
    </g>
  </g>

  <use href="#spark" class="tw" x="640" y="70" fill="#b9ffd9"/>
  <use href="#spark" class="tw" x="940" y="130" fill="#00E676" style="animation-delay:1.6s"/>
</svg>
