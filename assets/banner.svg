<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" role="img" aria-label="Pedro Henrique - Dev de Software e Modelador 3D">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#03150b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#00E676" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity="0.35"/>
    </pattern>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E676" stop-opacity="0"/>
      <stop offset="1" stop-color="#00E676" stop-opacity="0.28"/>
    </linearGradient>
    <clipPath id="frame"><rect x="10" y="10" width="980" height="300"/></clipPath>
    <path id="spark" d="M0-12Q0 0 12 0Q0 0 0 12Q0 0-12 0Q0 0 0-12Z"/>
  </defs>

  <style>
    text { font-family: 'Courier New', Consolas, monospace; }
    .gl-a { animation: gla 4s steps(1) infinite; }
    .gl-b { animation: glb 4s steps(1) infinite; }
    @keyframes gla { 0%,88%,100%{transform:translate(0,0)} 90%{transform:translate(-6px,1px)} 93%{transform:translate(4px,-2px)} 96%{transform:translate(-2px,1px)} }
    @keyframes glb { 0%,88%,100%{transform:translate(0,0)} 90%{transform:translate(6px,-1px)} 93%{transform:translate(-4px,2px)} 96%{transform:translate(2px,-1px)} }
    .blink { animation: bl 1s steps(1) infinite; }
    @keyframes bl { 50% { opacity: 0; } }
    .scan { animation: sc 5s linear infinite; }
    @keyframes sc { from { transform: translateY(0); } to { transform: translateY(240px); } }
    .tw { animation: tw 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes tw { 0%,100%{transform:scale(.3);opacity:.25} 50%{transform:scale(1);opacity:1} }
  </style>

  <!-- fundo -->
  <rect width="1000" height="320" fill="#000"/>
  <g clip-path="url(#frame)">
    <rect x="10" y="10" width="980" height="300" fill="url(#bg)"/>
    <rect x="10" y="10" width="980" height="300" fill="url(#grid)"/>
    <rect class="scan" x="10" y="38" width="980" height="50" fill="url(#sweep)"/>
    <rect x="10" y="10" width="980" height="300" fill="url(#scanlines)"/>
  </g>

  <!-- moldura + barra de título retrô -->
  <rect x="10" y="10" width="980" height="300" fill="none" stroke="#00E676" stroke-width="1.5"/>
  <rect x="10" y="10" width="980" height="28" fill="#00E676"/>
  <text x="24" y="29" font-size="14" font-weight="bold" fill="#000">C:\V0ID\PEDRO_HENRIQUE.EXE</text>
  <text x="976" y="29" font-size="14" font-weight="bold" fill="#000" text-anchor="end">[_] [#] [X]</text>

  <!-- status -->
  <text x="976" y="64" font-size="12" fill="#00E676" text-anchor="end" opacity="0.85">
    <tspan class="blink">&#9679;</tspan> ONLINE  //  @v0idguyy
  </text>

  <!-- rótulo -->
  <text x="60" y="95" font-size="14" fill="#00E676" opacity="0.8">&gt; SYSTEM.BOOT // USER_PROFILE</text>
  <rect class="blink" x="330" y="83" width="9" height="14" fill="#00E676"/>

  <!-- nome com glitch -->
  <text class="gl-a" x="60" y="170" font-size="66" font-weight="bold" letter-spacing="4" fill="#FF2BD6" opacity="0.75">PEDRO HENRIQUE</text>
  <text class="gl-b" x="60" y="170" font-size="66" font-weight="bold" letter-spacing="4" fill="#00E5FF" opacity="0.75">PEDRO HENRIQUE</text>
  <text x="60" y="170" font-size="66" font-weight="bold" letter-spacing="4" fill="#E8FFF3">PEDRO HENRIQUE</text>

  <!-- subtítulo -->
  <text x="62" y="207" font-size="20" fill="#00E676" letter-spacing="1">DEV DE SOFTWARE // MODELADOR 3D</text>

  <!-- tags -->
  <g font-size="13" font-weight="bold" fill="#00E676" text-anchor="middle">
    <rect x="60" y="226" width="86" height="26" fill="none" stroke="#00E676"/>
    <text x="103" y="244">ROB&#211;TICA</text>
    <rect x="156" y="226" width="86" height="26" fill="none" stroke="#00E676"/>
    <text x="199" y="244">HARDWARE</text>
    <rect x="252" y="226" width="112" height="26" fill="none" stroke="#00E676"/>
    <text x="308" y="244">PROGRAMA&#199;&#195;O</text>
  </g>

  <!-- barra de loading -->
  <text x="60" y="283" font-size="12" fill="#00E676" opacity="0.8">LOADING</text>
  <rect x="130" y="273" width="360" height="12" fill="none" stroke="#00E676"/>
  <rect x="132" y="275" height="8" fill="#00E676">
    <animate attributeName="width" values="0;356;356" keyTimes="0;0.8;1" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="60" y="303" font-size="10" fill="#00E676" opacity="0.4">0x76 0x30 0x69 0x64  // v0id</text>

  <!-- radar -->
  <g stroke="#00E676" fill="none" opacity="0.7">
    <circle cx="850" cy="178" r="80"/>
    <circle cx="850" cy="178" r="53" opacity="0.6"/>
    <circle cx="850" cy="178" r="26" opacity="0.6"/>
    <path d="M770 178H930M850 98V258" opacity="0.5"/>
  </g>
  <g>
    <path d="M850 178L850 98A80 80 0 0 1 906 121Z" fill="#00E676" fill-opacity="0.25"/>
    <path d="M850 178L850 98" stroke="#00E676" stroke-width="2"/>
    <animateTransform attributeName="transform" type="rotate" from="0 850 178" to="360 850 178" dur="6s" repeatCount="indefinite"/>
  </g>
  <circle class="blink" cx="890" cy="150" r="3" fill="#FF2BD6"/>
  <circle class="blink" cx="820" cy="215" r="3" fill="#00E5FF" style="animation-delay:.5s"/>
  <text x="850" y="278" font-size="11" fill="#00E676" text-anchor="middle" opacity="0.7">SCANNING...</text>

  <!-- brilhos y2k -->
  <use href="#spark" class="tw" x="720" y="90" fill="#00E5FF"/>
  <use href="#spark" class="tw" x="945" y="270" fill="#FF2BD6" style="animation-delay:1s"/>
  <use href="#spark" class="tw" x="600" y="285" fill="#00E676" style="animation-delay:2s"/>
</svg>
